merge_queue:
  mode: parallel
  max_parallel_checks: 4
scopes:
  source:
    files:
      src:
        include: ["src/**"]
      app:
        include: ["app/**"]
  barrier_files:
    include: ["barrier/**"]
  default_capacity: 4
queue_rules:
  - name: default
    conditions:
      - files~=^(src|app|barrier)/
      - check-success=race
pull_request_rules:
  - name: queue on label
    conditions:
      - label=queue-me
    actions:
      queue:
        name: default
