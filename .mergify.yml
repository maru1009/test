pull_request_rules:
  - name: queue on label
    conditions:
      - label=queue-me
    actions:
      queue:
        name: default
queue_rules:
  - name: default
    branch_protection_injection_mode: queue
    batch_size: 1
    queue_conditions:
      - base = main
      - label = queue-me
    merge_conditions:
      - base = main
      - label = never-satisfiable-hold
