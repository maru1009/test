merge_queue:
  mode: isolated
scopes:
  source:
    files:
      be:
        include: ["barrier/**"]
  barrier_files:
    include: ["barrier/**"]
  default_capacity: 2
queue_rules:
  - name: default
    conditions:
      - files~=^(src|app)/
pull_request_rules:
  - name: queue on label
    conditions:
      - label=queue-me
    actions:
      queue:
        name: default
  - name: scope probe
    conditions:
      - scope = be
    actions:
      comment:
        message: "SIM: be scope matched"
