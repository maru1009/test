pull_request_rules:
  - name: acknowledge queue label
    conditions:
      - label=queue-me
    actions:
      comment:
        message: "Merge queue label seen."

queue_rules:
  - name: default
    branch_protection_injection_mode: queue
    batch_size: 1
    queue_conditions:
      - base = main
      - label = queue-me
    merge_conditions:
      - base = main
